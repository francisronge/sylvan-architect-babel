name: Functional browser verification

# Pull requests and a nightly run on main; a merge to main gets no run of its
# own. Branch protection requires a pull request to be up to date with main,
# but its required checks are only "Provider-free verification" and "Renderer
# performance", so it does not enforce this workflow: a pull request can merge
# before its browser run finishes or after it fails, and a Markdown-only pull
# request skips the browser jobs. The nightly run checks main as merged, covers
# what changes without a commit (runner images, browser downloads) and keeps
# main's dependency and browser caches warm.
on:
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its unfinished run. Other runs never
# share a group, so nightly and manual runs always finish.
concurrency:
  group: browser-verification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Decide whether browsers can be affected
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      markdown-only: ${{ steps.files.outputs.markdown-only }}
    steps:
      # No browser spec, browser helper or the browser runner reads a Markdown
      # file, so a pull request that changes only Markdown skips the browser
      # jobs. The "Provider-free browser behavior" job still reports.
      - name: List the files the pull request changes
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "markdown-only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          total=$(wc -l < "$RUNNER_TEMP/files.txt")
          other=$(grep -vc '\.md$' "$RUNNER_TEMP/files.txt" || true)
          echo "$total changed files, $other not Markdown"
          # The files API lists at most 3,000 files; a list that long is not trusted.
          if [ "$total" -gt 0 ] && [ "$total" -lt 3000 ] && [ "$other" -eq 0 ]; then
            echo "markdown-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown-only=false" >> "$GITHUB_OUTPUT"
          fi

  browser-shard:
    name: Browser behavior (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.markdown-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # The shards of BROWSER_CI_SHARDS in scripts/browserSuites.mjs, split
        # by measured spec durations; the final job fails unless their
        # receipts cover the full gate.
        shard: [1, 2, 3]
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # The browser builds belong to the locked Playwright version. The install
      # step below skips builds already present and still installs the system
      # dependencies, which are not cached.
      - name: Restore pinned browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}-chromium-webkit

      # The system packages come from a mirror that can download at a few
      # hundred kB/s, too slow to fetch WebKit's dependencies within a job.
      # Keep the downloaded .deb files between runs so apt installs them locally.
      - name: Restore browser system packages
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-debs
          key: browser-debs-ubuntu-24.04-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Offer the kept packages to apt
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages
          if compgen -G "$HOME/browser-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/browser-debs/*.deb /var/cache/apt/archives/
          fi

      # A stalled package mirror once held this step for the job's whole 30
      # minutes. Bound each attempt and retry, so a stall costs minutes; apt
      # keeps the packages a killed attempt finished downloading.
      - name: Install pinned browser runtimes
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 15m npx --no-install playwright install --with-deps chromium webkit && exit 0
            echo "::warning::browser install attempt $attempt failed or stalled; retrying"
            # A killed attempt can leave apt holding its locks; clear them so the retry can run.
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Keep the browser system packages for later runs
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/browser-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/browser-debs/"

      - name: Save browser system packages
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}

      - name: Verify this shard's required browser suites
        run: npm run verify:browser -- --suite "ci:${{ matrix.shard }}" --evidence "$RUNNER_TEMP/browser-evidence"

      - name: Retain browser diagnostics and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-verification-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Retain the shard receipt for the coverage check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-receipt-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 14

  browser-verification:
    name: Provider-free browser behavior
    needs: [changes, browser-shard]
    # Always reports, so this check is never left pending: it passes for a
    # Markdown-only pull request whose shards were skipped, and otherwise only
    # when every shard passed and their receipts ran every required spec once.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shards to succeed, or to be skipped for Markdown only
        env:
          CHANGES: ${{ needs.changes.result }}
          MARKDOWN_ONLY: ${{ needs.changes.outputs.markdown-only }}
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          echo "changes: $CHANGES; markdown only: $MARKDOWN_ONLY; shards: $SHARDS"
          if [ "$CHANGES" != success ]; then exit 1; fi
          if [ "$MARKDOWN_ONLY" = true ]; then [ "$SHARDS" = skipped ]; exit $?; fi
          [ "$SHARDS" = success ]

      - name: Check out candidate
        if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x

      - name: Download the shard receipts
        if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: browser-receipt-*
          path: ${{ runner.temp }}/browser-receipts

      - name: Confirm the shards ran every required browser spec exactly once
        if: needs.changes.outputs.markdown-only != 'true'
        run: node scripts/checkBrowserShardReceipts.mjs "$RUNNER_TEMP/browser-receipts"
