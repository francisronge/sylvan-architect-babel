name: Renderer performance

# Every checkout leaves out docs/research/assets (research screenshots, most of
# the repository's size), which no check reads; a sparse checkout also fetches
# only the files it keeps (tests/ciChangeScope.test.mjs).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Revision to compare with the selected candidate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: renderer-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  renderer-performance:
    name: Renderer performance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/research/assets/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      # This job is a required check, so it always reports. A change outside
      # what the renderer page reads (scripts/ciChangeScope.mjs) passes
      # without measuring; manual runs always measure.
      - name: Decide whether the change can affect the renderer
        id: scope
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "replay=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" --jq '.[] | "\(.status)\t\(.filename)", (select(.previous_filename) | "\(.status)\t\(.previous_filename)")' > "$RUNNER_TEMP/files.txt"
          node scripts/ciChangeScope.mjs --files "$RUNNER_TEMP/files.txt" --github-output

      - name: Check out PR base
        if: steps.scope.outputs.replay == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref }}
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/research/assets/
          sparse-checkout-cone-mode: false

      - name: Install both locked dependency sets
        if: steps.scope.outputs.replay == 'true'
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate

      - name: Read the locked Playwright version
        if: steps.scope.outputs.replay == 'true'
        id: playwright
        working-directory: candidate
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # The browser builds and the browser system packages the nightly
      # browser-verification run saves from main, under its keys
      # (browser-verification.yml). Without them the install step below
      # downloads Chromium and fetches 21 MB of font packages from a mirror
      # that has run at 83 kB/s: 4.5 minutes in 2 of 18 measured runs. This
      # job only restores: it has no nightly run to save from main, and a
      # cache a pull request saved under these keys would shadow main's
      # complete one for that pull request's browser shards.
      - name: Restore pinned browser downloads
        if: steps.scope.outputs.replay == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Restore browser system packages
        if: steps.scope.outputs.replay == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-debs
          key: browser-debs-ubuntu-24.04-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Offer the kept packages to apt
        if: steps.scope.outputs.replay == 'true'
        run: |
          if compgen -G "$HOME/browser-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/browser-debs/*.deb /var/cache/apt/archives/
          fi

      - name: Install the pinned Chromium runtime
        if: steps.scope.outputs.replay == 'true'
        working-directory: candidate
        # Bounded and retried, as in browser-verification.yml.
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 10m npx --no-install playwright install --with-deps chromium && exit 0
            echo "::warning::browser install attempt $attempt failed or stalled; retrying"
            # A killed attempt can leave apt holding its locks; clear them so the retry can run.
            # pkill only sends the signal: wait until those processes have exited, so the repair
            # cannot lock a new file while a dying process still holds the old one.
            sudo pkill -9 -f 'apt-get|dpkg' || true
            for second in $(seq 60); do pgrep -f 'apt-get|dpkg' > /dev/null || break; sleep 1; done
            if pgrep -f 'apt-get|dpkg' > /dev/null; then
              echo "::warning::apt or dpkg is still running; leaving its locks in place"
              continue
            fi
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Compare actual browser opening times
        if: steps.scope.outputs.replay == 'true'
        working-directory: candidate
        run: npm run verify:renderer-performance -- --baseline-root ../baseline --report "$RUNNER_TEMP/renderer-performance.json"

      - name: Preserve the compact timing report in the job log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/renderer-performance.json" ]; then
            cat "$RUNNER_TEMP/renderer-performance.json"
          fi

      - name: Retain the timing report and build identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renderer-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renderer-performance.json
          if-no-files-found: warn
          retention-days: 30
