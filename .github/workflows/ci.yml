name: CI

# Pull requests and a nightly run on main. A merge to main needs no run of its
# own: branch protection requires every pull request to be up to date with
# main, so the merged tree is the tree its pull request already verified. The
# nightly run covers what changes without a commit (new dependency advisories,
# runner images) and keeps main's dependency cache warm.
on:
  pull_request:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its unfinished run. Other runs never
# share a group, so nightly and manual runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The required check is the aggregating "Provider-free verification" job. The
# other jobs split `npm run verify:all`, the visual and camera audits and the
# release checks across parallel runners; together they run the same checks.
jobs:
  contract:
    name: Typecheck, contract and release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      # The jobs below run the parts of verify:all, and both offline audits in
      # one pass, directly. Fail when these scripts change so a new part cannot
      # silently skip CI.
      - name: Confirm CI covers every part of verify:all
        run: |
          node -e '
            const { scripts } = require("./package.json");
            const expected = {
              "verify:all": "npm run typecheck && npm run verify:exceptions && npm run verify:offline",
              "verify:offline": "npm test && npm run verify:parse-contract",
              test: "NODE_COMPILE_CACHE=\"$PWD/node_modules/.cache/node-compile\" node --test --test-concurrency=6 tests/*.test.mjs",
              "verify:visual-offline": "node scripts/auditReplayVisuals.mjs --fixtures --viewports desktop,desktop-large --exceptions tests/helpers/visualExceptions.mjs --snapshot fixtures/replay-snapshots/fixture-layout.json",
              "verify:camera-offline": "node scripts/auditReplayVisuals.mjs --audit camera --fixtures --viewports desktop,mobile --exceptions tests/helpers/cameraExceptions.mjs",
              "verify:replay-offline": "node scripts/auditReplayVisuals.mjs --fixtures --audit visual --viewports desktop,desktop-large --exceptions tests/helpers/visualExceptions.mjs --audit camera --viewports desktop,mobile --exceptions tests/helpers/cameraExceptions.mjs --snapshot fixtures/replay-snapshots/fixture-layout.json",
              "verify:corpus": "node scripts/compareReplayCorpus.mjs",
            };
            const changed = Object.entries(expected).filter(([name, command]) => scripts[name] !== command);
            for (const [name, command] of changed) {
              console.error(`::error::package.json "${name}" is ${JSON.stringify(scripts[name])}; .github/workflows/ci.yml runs ${JSON.stringify(command)}. Update the workflow to match.`);
            }
            process.exit(changed.length ? 1 : 0);
          '

      - name: Confirm the offline test shards partition npm test
        run: node scripts/ciTestShard.mjs --check 6 tests/*.test.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # verify:exceptions compares tests/helpers/*Exceptions.mjs with the
      # revision this change starts from (scripts/checkExceptionGrowth.mjs).
      - name: Fetch the revision this change starts from
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          echo "BABEL_EXCEPTION_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Verify exceptions did not grow without approval
        run: npm run verify:exceptions

      - name: Verify provider-free parse contract
        run: npm run verify:parse-contract

      - name: Build production frontend
        run: npm run build

      - name: Verify release assets and links
        run: npm run release:verify-assets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=low

  offline-tests:
    name: Offline tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep this list, the job name and the shard check at six shards.
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # As `npm test` does, the shard's test processes share compiled modules.
      - name: Run offline test shard
        env:
          NODE_COMPILE_CACHE: ${{ github.workspace }}/node_modules/.cache/node-compile
        run: node scripts/ciTestShard.mjs ${{ matrix.shard }}/6 tests/*.test.mjs

  replay-offline-shard:
    name: Static Replay geometry and camera (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep this list, the job name and the merge below at two shards.
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # verify:visual-offline and verify:camera-offline in one pass, with the
      # same reports and exceptions, over every second analysis. Four workers
      # use the runner's four vCPUs; each analysis is audited independently,
      # so the results do not depend on the shard or worker count. The shard
      # writes its raw results; the job below judges them all together.
      - name: Audit this shard's static Replay geometry and camera
        run: npm run verify:replay-offline -- --jobs 4 --shard ${{ matrix.shard }}/2 --results-out "$RUNNER_TEMP/replay-offline-${{ matrix.shard }}.json"

      - name: Retain the shard results for the judgment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One name per shard: a re-run of a failed shard replaces its
          # results, and the judgment reads the latest results of each shard.
          name: replay-offline-${{ matrix.shard }}
          path: ${{ runner.temp }}/replay-offline-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  replay-offline:
    name: Static Replay geometry and camera
    needs: replay-offline-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: replay-offline-*
          path: ${{ runner.temp }}/replay-offline
          merge-multiple: true

      # The same command judges both shards' results as one run: it selects the
      # same analyses and audits, refuses unless the shards hold each analysis
      # exactly once, and then fails on new, grown or stale exceptions and on
      # any fingerprint difference, as verify:replay-offline does.
      - name: Verify static Replay geometry and camera offline
        run: |
          npm run verify:replay-offline -- \
            --merge "$RUNNER_TEMP/replay-offline/replay-offline-1.json" \
            --merge "$RUNNER_TEMP/replay-offline/replay-offline-2.json"

  corpus-motion-shard:
    name: Replay motion against the PR base (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Keep this list, the job name and the merge below at two shards.
        shard: [1, 2]

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - name: Check out PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          path: baseline
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install both locked dependency sets
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate

      # Each shard lays out its share of every committed fixture analysis in
      # both checkouts on the measured path the browser paints and writes the
      # measurements unjudged; the job below compares them all. Four worker
      # processes, shared by both checkouts, use the runner's four vCPUs;
      # records are measured independently, so the measurements do not depend
      # on the shard or worker count.
      - name: Measure this shard in both checkouts
        working-directory: candidate
        run: |
          node scripts/buildCorpusArchiveManifest.mjs --fixtures --out "$RUNNER_TEMP/fixtures-manifest.json"
          npm run -s verify:corpus -- --baseline-root ../baseline --candidate-root . \
            --archive-manifest "$RUNNER_TEMP/fixtures-manifest.json" --timeout-ms 1200000 --jobs 4 \
            --shard ${{ matrix.shard }}/2 --snapshots-out "$RUNNER_TEMP/corpus-motion-${{ matrix.shard }}.json"

      - name: Retain the shard measurements for the comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One name per shard: a re-run of a failed shard replaces its
          # measurements, and the comparison reads the latest of each shard.
          name: corpus-motion-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/corpus-motion-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  corpus-motion:
    name: Replay motion against the PR base
    needs: corpus-motion-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      # The comparison judges a fixture the base checkout lacks by motion only.
      - name: Check out PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          path: baseline
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix candidate

      - name: Download the shard measurements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: corpus-motion-shard-*
          path: ${{ runner.temp }}/corpus-motion
          merge-multiple: true

      # A noticeable new motion fault or one that moves noticeably farther
      # (scripts/replayMotionContinuity.mjs), not approved in
      # tests/helpers/motionExceptions.mjs, or a movement the base shows as
      # movement losing its moment, fails the job. Fixture Replay and layout
      # changes are reviewed through the committed layout fingerprint. The
      # comparison selects the same records, and refuses unless the shards
      # measured each exactly once in each checkout, with one harness and
      # one source identity per checkout.
      - name: Compare Replay motion with the PR base
        working-directory: candidate
        run: |
          node scripts/buildCorpusArchiveManifest.mjs --fixtures --out "$RUNNER_TEMP/fixtures-manifest.json"
          npm run -s verify:corpus -- --baseline-root ../baseline --candidate-root . \
            --archive-manifest "$RUNNER_TEMP/fixtures-manifest.json" \
            --merge "$RUNNER_TEMP/corpus-motion/corpus-motion-1.json" \
            --merge "$RUNNER_TEMP/corpus-motion/corpus-motion-2.json" \
            --output "$RUNNER_TEMP/corpus-motion.json"

      - name: Retain the comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-motion.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Provider-free verification
    needs: [contract, offline-tests, replay-offline-shard, replay-offline, corpus-motion-shard, corpus-motion]
    # GitHub treats a skipped required check as passing, so this job always
    # runs and fails unless every needed job succeeded.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const results = Object.entries(JSON.parse(process.env.RESULTS));
            for (const [job, { result }] of results) console.log(`${job}: ${result}`);
            process.exit(results.length > 0 && results.every(([, { result }]) => result === "success") ? 0 : 1);
          '
